<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>皇后娱乐 · Queen Entertainment</title>
  

  <link rel="stylesheet" href="./dist/table.css" />
</head>

<body class="flex flex-col antialiased">

  <!-- TOP STATUS BAR -->
  <header class="h-10 border-b border-black bg-[#060a08] flex items-center justify-between px-4 md:px-8 z-30 shrink-0">
    <div class="flex items-center space-x-3">
      <span class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]"></span>
      <span class="font-cinzel text-xs md:text-sm font-bold tracking-[0.25em] text-[#d4b87a]">皇后娱乐 QUEEN</span>
      <span class="text-[9px] text-zinc-500 font-mono tracking-wider hidden sm:inline">QUEEN ENTERTAINMENT</span>
    </div>

    <div class="flex items-center space-x-5 text-[10px] font-mono text-zinc-400">
      <div class="hidden sm:flex items-center space-x-3">
        <span>TABLE <b class="text-zinc-200">#08</b></span>
        <span class="text-zinc-600">|</span>
        <span>SHOE <b id="shoe-num" class="text-zinc-200">#001</b></span>
        <span class="text-zinc-600">|</span>
        <span>REMAINING <b id="cards-remaining" class="text-[#c8a762]">416</b></span>
        <span class="text-zinc-600">|</span>
        <span>ROUND <b id="round-num" class="text-white">#1</b></span>
      </div>

      <div class="flex items-center space-x-2 bg-black/60 px-3 py-1 rounded border border-[#c8a762]/20">
        <span class="text-[9px] text-zinc-500 uppercase font-sans">虚拟筹码</span>
        <span id="player-balance" class="text-xs md:text-sm font-bold font-mono text-[#ecd89d]">100,000</span>
      </div>
    </div>
  </header>

  <!-- TABLE FELT CONTAINER -->
  <main class="flex-1 flex flex-col table-container justify-between">
    
    <div id="table-felt" class="flex-1 real-table-felt flex flex-col justify-between p-2 md:p-5 relative overflow-hidden">
      
      <!-- APPARATUS SECTOR -->
      <div class="flex items-start justify-between relative z-10">
        <!-- Discard Vault -->
        <div class="w-16 md:w-20 flex flex-col items-center">
          <div class="discard-rack w-12 h-16 md:w-16 md:h-20 rounded border border-white/5 flex flex-col items-center justify-center p-1">
            <div class="w-full h-1 bg-white/10 rounded mb-1"></div>
            <span class="text-[7px] md:text-[8px] font-cinzel text-zinc-500 font-bold tracking-widest text-center uppercase leading-tight">DISCARD<br>VAULT</span>
          </div>
        </div>

        <!-- Center Notification -->
        <div class="flex flex-col items-center max-w-xs md:max-w-md text-center">
          <div class="flex items-center space-x-2 opacity-60 mb-0.5">
            <span class="h-[1px] w-6 bg-gradient-to-r from-transparent to-[#c8a762]"></span>
            <span class="font-cinzel text-[8px] md:text-[9px] tracking-[0.3em] text-[#c8a762] uppercase">本地练习 · 刷新重置</span>
            <span class="h-[1px] w-6 bg-gradient-to-l from-transparent to-[#c8a762]"></span>
          </div>
          
          <div id="dealer-announcement" class="px-5 py-0.5 md:py-1 rounded bg-[#040d08]/90 border border-[#c8a762]/30 shadow-2xl transition-all">
            <span id="announcement-text" role="status" aria-live="polite" class="font-cinzel text-[11px] md:text-xs font-bold tracking-[0.2em] text-[#edd59b]">请选择筹码并下注</span>
          </div>

          <div class="rule-note">
            <span id="rule-summary"></span>
          </div>
        </div>

        <!-- Shoe Chute Exit Origin -->
        <div class="w-20 md:w-28 flex flex-col items-end">
          <div id="shoe-box" class="dealer-shoe-box w-16 h-20 md:w-24 md:h-24 p-1.5 flex flex-col justify-between">
            <div class="flex justify-between items-center text-[7px] font-mono text-zinc-400">
              <span>8 DECK</span>
              <span class="text-[#c8a762]">LOCAL</span>
            </div>
            <div id="shoe-chute-origin" class="dealer-shoe-chute w-full h-8 md:h-10 rounded flex items-center justify-center relative overflow-hidden">
              <div class="w-full h-1 bg-black absolute bottom-0"></div>
              <span class="text-[8px] font-cinzel text-[#c8a762]/60 tracking-widest uppercase">DEAL SLOT</span>
            </div>
          </div>
        </div>
      </div>

      <div class="practice-bar"><span>纯娱乐 · 虚拟筹码无现金价值</span><span>本局投注 <b id="total-bet">0</b> · 上局净值 <b id="last-profit">—</b></span></div>
      <!-- CARDS COMBAT SLOTS ARENA -->
      <div class="flex-1 flex items-center justify-around px-2 md:px-12 my-1 md:my-2 relative z-10">
        
        <!-- Player Hand Zone -->
        <div class="flex flex-col items-center flex-1 max-w-[280px] md:max-w-[340px]">
          <div class="flex items-center space-x-3 mb-1.5">
            <span class="font-cinzel font-bold text-xs md:text-sm tracking-[0.2em] felt-print-blue">PLAYER</span>
            <div id="player-score-badge" class="hidden w-5 h-5 md:w-6 md:h-6 rounded-full bg-blue-900/90 border border-blue-400 text-[10px] md:text-xs font-bold text-white flex items-center justify-center shadow-lg">0</div>
          </div>

          <div class="flex space-x-1.5 md:space-x-2.5 p-2 rounded-lg card-drop-recess w-full justify-center min-h-[96px] md:min-h-[128px]">
            <div id="player-slot-0" class="w-12 h-18 md:w-16 md:h-24 rounded border border-white/5 flex items-center justify-center"></div>
            <div id="player-slot-1" class="w-12 h-18 md:w-16 md:h-24 rounded border border-white/5 flex items-center justify-center"></div>
            <div id="player-slot-2" class="w-12 h-18 md:w-16 md:h-24 rounded border border-white/5 flex items-center justify-center"></div>
          </div>
        </div>

        <!-- Crest Divider -->
        <div class="hidden lg:flex flex-col items-center opacity-25 px-2">
          <div class="w-[1px] h-8 bg-gradient-to-b from-transparent via-[#c8a762] to-transparent mb-1"></div>
          <span class="font-cinzel text-xl">Q</span>
          <div class="w-[1px] h-8 bg-gradient-to-b from-transparent via-[#c8a762] to-transparent mt-1"></div>
        </div>

        <!-- Banker Hand Zone -->
        <div class="flex flex-col items-center flex-1 max-w-[280px] md:max-w-[340px]">
          <div class="flex items-center space-x-3 mb-1.5">
            <span class="font-cinzel font-bold text-xs md:text-sm tracking-[0.2em] felt-print-red">BANKER</span>
            <div id="banker-score-badge" class="hidden w-5 h-5 md:w-6 md:h-6 rounded-full bg-rose-900/90 border border-rose-400 text-[10px] md:text-xs font-bold text-white flex items-center justify-center shadow-lg">0</div>
          </div>

          <div class="flex space-x-1.5 md:space-x-2.5 p-2 rounded-lg card-drop-recess w-full justify-center min-h-[96px] md:min-h-[128px]">
            <div id="banker-slot-0" class="w-12 h-18 md:w-16 md:h-24 rounded border border-white/5 flex items-center justify-center"></div>
            <div id="banker-slot-1" class="w-12 h-18 md:w-16 md:h-24 rounded border border-white/5 flex items-center justify-center"></div>
            <div id="banker-slot-2" class="w-12 h-18 md:w-16 md:h-24 rounded border border-white/5 flex items-center justify-center"></div>
          </div>
        </div>
      </div>

      <!-- BETTING GRID -->
      <div class="w-full max-w-4xl mx-auto z-10 px-1 md:px-4">
        <div class="grid grid-cols-3 gap-2 mb-2 font-cinzel">
          <button type="button" data-bet-target="playerPair" class="bet-cell rounded-md p-1.5 md:p-2 felt-line-gold flex flex-col items-center justify-center cursor-pointer">
            <span class="text-[10px] md:text-xs font-bold felt-print-blue">P.PAIR</span>
            <span class="text-[8px] md:text-[9px] text-[#c8a762]/70 font-mono">11 TO 1</span>
            <div class="chip-stack-anchor mt-0.5 h-4 flex items-center justify-center"></div>
          </button>

          <button type="button" data-bet-target="tie" class="bet-cell rounded-md p-1.5 md:p-2 border border-emerald-600/40 flex flex-col items-center justify-center cursor-pointer">
            <span class="text-xs md:text-sm font-extrabold tracking-widest text-emerald-400/90">TIE</span>
            <span class="text-[9px] text-emerald-300/60 font-mono">8 TO 1</span>
            <div class="chip-stack-anchor mt-0.5 h-4 flex items-center justify-center"></div>
          </button>

          <button type="button" data-bet-target="bankerPair" class="bet-cell rounded-md p-1.5 md:p-2 felt-line-gold flex flex-col items-center justify-center cursor-pointer">
            <span class="text-[10px] md:text-xs font-bold felt-print-red">B.PAIR</span>
            <span class="text-[8px] md:text-[9px] text-[#c8a762]/70 font-mono">11 TO 1</span>
            <div class="chip-stack-anchor mt-0.5 h-4 flex items-center justify-center"></div>
          </button>
        </div>

        <div class="grid grid-cols-2 gap-3 font-cinzel">
          <button type="button" data-bet-target="player" class="bet-cell rounded-lg p-2.5 md:p-4 border-2 border-blue-600/30 flex flex-col items-center justify-center cursor-pointer min-h-[64px] md:min-h-[82px]">
            <span class="text-sm md:text-base font-black tracking-[0.25em] felt-print-blue">PLAYER</span>
            <span class="text-[9px] text-blue-300/60 font-mono">PAYS 1 TO 1</span>
            <div class="chip-stack-anchor mt-1 h-5 flex items-center justify-center"></div>
          </button>

          <button type="button" data-bet-target="banker" class="bet-cell rounded-lg p-2.5 md:p-4 border-2 border-rose-600/30 flex flex-col items-center justify-center cursor-pointer min-h-[64px] md:min-h-[82px]">
            <span class="text-sm md:text-base font-black tracking-[0.25em] felt-print-red">BANKER</span>
            <span class="text-[9px] text-rose-300/60 font-mono">0.95 TO 1</span>
            <div class="chip-stack-anchor mt-1 h-5 flex items-center justify-center"></div>
          </button>
        </div>
      </div>

    </div>

    <!-- ROADMAP PANEL -->
    <section id="roadmap-panel" class="h-28 md:h-36 bg-[#040805] border-t border-[#c8a762]/20 flex flex-col shrink-0 px-2 pt-1">
      <div class="flex items-center justify-between px-2 py-0.5 text-[9px] text-zinc-400 font-mono border-b border-white/5">
        <div class="flex space-x-4">
          <span>PLAYER: <b id="stat-p" class="text-blue-400">0</b></span>
          <span>BANKER: <b id="stat-b" class="text-rose-400">0</b></span>
          <span>TIE: <b id="stat-t" class="text-emerald-400">0</b></span>
        </div>
        <span class="text-zinc-600 text-[8px]">仅记录模拟结果 · 不预测下一局</span>
      </div>

      <div class="flex-1 flex overflow-x-auto overflow-y-hidden divide-x divide-white/5 py-1">
        <div class="w-40 md:w-52 shrink-0 flex flex-col">
          <span class="text-[7px] text-zinc-500 font-bold uppercase mb-0.5">Bead Road</span>
          <div id="bead-road-grid" class="flex-1 grid grid-rows-6 grid-flow-col auto-cols-[14px] md:auto-cols-[17px] gap-[1px] bg-black/40 p-0.5 overflow-x-auto"></div>
        </div>
        <div class="flex-1 flex flex-col min-w-[260px] pl-2">
          <span class="text-[7px] text-zinc-500 font-bold uppercase mb-0.5">Big Road</span>
          <div id="big-road-grid" class="flex-1 grid grid-rows-6 grid-flow-col auto-cols-[11px] md:auto-cols-[13px] gap-[1px] bg-black/30 overflow-x-auto"></div>
        </div>
      </div>
    </section>

    <!-- FLUTED CHIP RAIL & ACTIONS -->
    <footer class="chip-rail p-2 md:p-3 shrink-0 flex flex-wrap items-center justify-between gap-3 z-30">
      <div class="flex items-center space-x-1.5">
        <button id="btn-clear-bets" class="px-2.5 py-1.5 rounded bg-black/60 hover:bg-black/90 border border-white/10 text-[10px] font-cinzel font-bold text-zinc-300 transition active:scale-95 flex items-center space-x-1">
          
          <span>清空 CLEAR</span>
        </button>
        <button id="btn-double-bets" class="px-2.5 py-1.5 rounded bg-black/60 hover:bg-black/90 border border-white/10 text-[10px] font-cinzel font-bold text-zinc-300 transition active:scale-95 flex items-center space-x-1">
          
          <span>加倍 DOUBLE</span>
        </button>
        <button id="btn-rebet" class="px-2.5 py-1.5 rounded bg-black/60 hover:bg-black/90 border border-white/10 text-[10px] font-cinzel font-bold text-zinc-300 transition active:scale-95 flex items-center space-x-1">
          
          <span>重押 REBET</span>
        </button>
      </div>

      <!-- Chip Rack -->
      <div id="chip-selector" class="flex items-center space-x-2 md:space-x-3 overflow-x-auto py-1 px-2 bg-black/40 rounded-full border border-white/5">
        <button type="button" data-val="50" class="chip-token w-9 h-9 md:w-11 md:h-11 rounded-full flex items-center justify-center font-bold text-xs cursor-pointer border-2 border-dashed border-white/70 bg-gradient-to-b from-blue-600 to-blue-900 shadow-lg transform transition active:scale-95" aria-label="50 虚拟筹码">50</button>
        <button type="button" data-val="100" class="chip-token w-9 h-9 md:w-11 md:h-11 rounded-full flex items-center justify-center font-bold text-xs cursor-pointer border-2 border-dashed border-white/70 bg-gradient-to-b from-purple-600 to-purple-900 shadow-lg transform transition active:scale-95" aria-label="100 虚拟筹码">100</button>
        <button type="button" data-val="500" class="chip-token w-9 h-9 md:w-11 md:h-11 rounded-full flex items-center justify-center font-bold text-xs cursor-pointer border-2 border-dashed border-white/70 bg-gradient-to-b from-teal-600 to-teal-900 shadow-lg transform transition active:scale-95" aria-label="500 虚拟筹码">500</button>
        <button type="button" data-val="1000" class="chip-token w-9 h-9 md:w-11 md:h-11 rounded-full flex items-center justify-center font-bold text-[10px] md:text-xs cursor-pointer border-2 border-dashed border-[#ecd89d] bg-gradient-to-b from-amber-600 to-amber-900 shadow-lg transform transition active:scale-95" aria-label="1000 虚拟筹码">1K</button>
        <button type="button" data-val="5000" class="chip-token w-9 h-9 md:w-11 md:h-11 rounded-full flex items-center justify-center font-bold text-[10px] md:text-xs cursor-pointer border-2 border-dashed border-white/80 bg-gradient-to-b from-rose-700 to-rose-950 shadow-lg transform transition active:scale-95" aria-label="5000 虚拟筹码">5K</button>
        <button type="button" data-val="10000" class="chip-token w-9 h-9 md:w-11 md:h-11 rounded-full flex items-center justify-center font-bold text-[10px] md:text-xs cursor-pointer border-2 border-solid border-[#c8a762] bg-gradient-to-b from-zinc-800 to-black text-[#ebd69b] shadow-xl transform transition active:scale-95" aria-label="10000 虚拟筹码">10K</button>
      </div>

      <!-- Main Action Deal -->
      <div class="flex items-center space-x-2">
        <button id="btn-deal" class="font-cinzel px-6 py-2 rounded bg-gradient-to-b from-[#dfc282] via-[#c8a762] to-[#997736] text-black font-black text-xs md:text-sm tracking-[0.2em] shadow-[0_4px_16px_rgba(0,0,0,0.6)] hover:brightness-110 active:scale-95 transition disabled:opacity-30 disabled:pointer-events-none">
          发牌 DEAL
        </button>
      </div>
    </footer>
  </main>

  <p id="action-message" role="status" aria-live="polite" class="action-message"></p>
  <div id="flight-overlay" class="fixed inset-0 pointer-events-none z-50"></div>

  <!-- CORE LOGIC & ENGINE INTEGRATION -->
  <script type="module" src="./dist/src/app.js"></script>
</body>
</html>
